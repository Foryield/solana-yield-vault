[package]
name = "yield-vault"
description = "Coffre de rendement : depot, parts Token-2022, retrait, pause"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "yield_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
# Les parts sont un mint Token-2022 a extension et l'actif depose un jeton SPL
# classique : le coffre manipule DEUX programmes de jeton, ce que couvre
# token_interface. anchor-spl porte aussi la contrainte extensions::transfer_hook,
# qui permet de creer le mint DANS le programme plutot que de valider un mint
# fourni de l'exterieur, donc sans surface de validation.
anchor-spl = { version = "1.1.2", features = ["token_2022", "token_2022_extensions"] }

[dev-dependencies]
# Les invariants de l'arithmetique se cherchent sur un espace, pas sur des
# exemples choisis a la main : meme outil et meme motif que la version Soroban.
proptest = "1"
litesvm = "0.10.0"
solana-instruction = "3"
solana-program-pack = "3"
solana-transaction-error = "3"
solana-pubkey = "3"
solana-system-interface = "2"
spl-token = { version = "9", features = ["no-entrypoint"] }
spl-token-2022 = { version = "11", features = ["no-entrypoint"] }
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
