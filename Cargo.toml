[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"
license = "MIT"

# `overflow-checks` est NON NEGOCIABLE : un debordement silencieux dans la math
# de parts est une perte de fonds, pas un defaut cosmetique. Meme posture que
# le profil release du depot soroban-yield-vault.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
