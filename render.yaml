# Render Blueprint - demonstration statique du coffre Solana (devnet).
# Deploiement : Render -> New -> Blueprint -> pointer ce depot.
# La UI Next.js (dossier web/) est exportee en statique : pas de serveur,
# pas de demarrage a froid, palier gratuit toujours en ligne.
#
# AUCUN `rootDir`, ET C'EST LE POINT DELICAT DE CE FICHIER.
#
# `web/` depend du paquet client en `file:../client`, dont le script `prepare`
# construit le paquet a l'installation du consommateur. Ce script exige les
# outils du client, qui doivent donc etre poses AVANT.
#
# Render installe automatiquement les dependances trouvees a la racine de
# construction, avant meme d'executer la commande ci-dessous. Avec
# `rootDir: web`, cette installation automatique declenchait le `prepare` du
# client alors que `client/node_modules` n'existait pas encore : le binaire
# etait trouve, ses types non, et la construction s'arretait sur un
# « Cannot find type definition file for 'node' » qui ne nomme rien de la vraie
# cause. Constate au premier deploiement, le 01/08.
#
# La racine du depot ne porte pas de package.json : rien n'y est installe
# d'office, et l'ordre ci-dessous est donc le seul qui s'applique.
services:
  - type: web
    name: foryield-solana-demo
    runtime: static
    buildCommand: npm ci --prefix client && npm ci --prefix web && npm run build --prefix web
    staticPublishPath: web/out
    pullRequestPreviewsEnabled: false
    # Valeurs PUBLIQUES : identifiants deployes sur devnet et points d'acces.
    # Aucun secret ; aucune cle ne rentre ici, ni ailleurs dans ce depot.
    envVars:
      # Alignee sur l'integration continue. Le premier deploiement a pris le
      # defaut de Render, Node 24, que rien n'a jamais eprouve ici.
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: NEXT_PUBLIC_VAULT_PROGRAM_ID
        value: 2bkjZG8njXHQ1tdj5aRSiwjjndX1qEvjFYzBYJQjNysw
      - key: NEXT_PUBLIC_HOOK_PROGRAM_ID
        value: EGbJBdCUK5ecUiVJ9FFiGdVEZQ15cE31zNm97RUpFK63
      - key: NEXT_PUBLIC_DEPOSIT_MINT
        value: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
      # Les deux porteurs de demonstration de la preuve du 01/08, proposes en
      # prereglage sur l'ecran de transfert. Cles publiques seules.
      - key: NEXT_PUBLIC_PORTEUR_AUTORISE
        value: Dz7mzmQS9YDvDMu9faWms41rfcyUM3vZDRXu9ZNhLgKr
      - key: NEXT_PUBLIC_PORTEUR_NON_AUTORISE
        value: BeBQQqjuUFU1qjJayMg46CWuaKw7oTJ5R4UfoVLVKohL
