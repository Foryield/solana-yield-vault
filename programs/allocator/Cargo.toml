[package]
name = "allocator"
description = "Allocateur : place l'actif d'un coffre sur des venues de rendement"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "allocator"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
# UNIQUEMENT pour lire des soldes de compte de jeton, avant et apres chaque
# invocation croisee : c'est la ceinture qui ne doit rien a l'arithmetique du
# tiers. `token_interface` couvre indifferemment SPL et Token-2022, le jeton de
# recu d'une venue n'etant pas le notre. Meme version que le coffre, deja
# resolue dans le verrou du plan de travail : aucune dependance nouvelle
# n'entre dans le depot.
anchor-spl = { version = "1.1.2", features = ["token_2022"] }

[dev-dependencies]
# L'arithmetique d'une venue se cherche sur un espace, pas sur des exemples
# choisis a la main : meme outil et meme motif que le coffre.
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
