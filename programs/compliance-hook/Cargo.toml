[package]
name = "compliance-hook"
description = "Hook de transfert Token-2022 : liste d'autorisation des porteurs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "compliance_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = { version = "1.1.2", features = ["token_2022"] }
# Versions ALIGNEES sur celles que spl-token-2022 11 tire deja dans l'arbre :
# une divergence dupliquerait les types et les rendrait incompatibles entre le
# programme et ses tests.
spl-discriminator = "0.5"
spl-tlv-account-resolution = "0.11.1"
spl-transfer-hook-interface = "2.1.0"
spl-token-2022 = { version = "11", default-features = false, features = ["no-entrypoint"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-instruction = "3"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-program-pack = "3"
solana-pubkey = "3"
solana-signer = "3.0.0"
solana-system-interface = "2"
solana-transaction = "3.0.2"
solana-transaction-error = "3"
spl-token-2022 = { version = "11", features = ["no-entrypoint"] }
spl-type-length-value = "0.9.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
